name: Quality Gate

on:
  push:
  pull_request:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify toolchain
        run: |
          node --version
          pnpm --version
          pnpm exec tsc --version

      - name: Run quality gate
        env:
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: github-actions-build-secret-not-for-production
          GOOGLE_CLIENT_ID: github-actions-google-client-id
          GOOGLE_CLIENT_SECRET: github-actions-google-client-secret
        run: pnpm run ci
