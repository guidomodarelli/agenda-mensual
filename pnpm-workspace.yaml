allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  sharp: true
  unrs-resolver: true
  msw: false
# Keep the existing googleapis-owned error type available without a direct dependency.
publicHoistPattern:
  - gaxios
minimumReleaseAgeExclude:
  - react@19.3.0
  - react-dom@19.3.0
  - scheduler@0.28.0
  - '@types/react@19.3.0'
  - '@types/react-dom@19.3.0'
  - beez-ui@0.5.5
